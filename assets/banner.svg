<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".25"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".5" stdDeviation="8"/></filter><style>@keyframes float{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}.background-glow{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.floating-node{animation:float 5s ease-in-out infinite}.flow-line{stroke-dasharray:8,8;animation:dash 2s linear infinite}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:48px;fill:url(#textGrad)}.subtitle-text{font-weight:400;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}</style></defs><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><circle cx="600" cy="160" r="280" fill="url(#glow)" class="background-glow"/><g stroke="#334155" stroke-width="1" opacity=".4"><line x1="100" x2="1100" y1="60" y2="60"/><line x1="100" x2="1100" y1="260" y2="260"/><line x1="200" x2="200" y1="20" y2="300"/><line x1="1000" x2="1000" y1="20" y2="300"/></g><path fill="none" stroke="#38bdf8" stroke-width="2" d="M